<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quis Curso Tem — Senac</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Quis Curso Tem</h1>
        <p>Senac Penha e São Miguel Paulista</p>
    </header>

    <main>
        <section id="mapa" aria-label="Mapa das unidades">
            <div class="placeholder-mapa">
                <span aria-hidden="true">🗺️</span>
                <p>Mapa em breve</p>
            </div>
        </section>

        <section id="busca" aria-label="Busca de cursos">
            <input
                type="search"
                class="campo-busca"
                placeholder="Buscar curso, tema, unidade..."
                disabled
            >
        </section>

        <section id="lista-cursos" aria-label="Lista de cursos">
            <ul id="itens-cursos">
                <!-- Populado via JavaScript -->
            </ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
